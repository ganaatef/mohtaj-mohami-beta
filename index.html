<head>

  -->
  <base href="/mohtaj-mohami-beta/">

  <meta charset="UTF-8">
  <meta name="theme-color" content="#071728">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="محتاج محامي — مساعدة قانونية وطلب محامي.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="محتاج محامي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260912-v6">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260912-v6"/>

  <title>محتاج محامي</title>
  <link rel="manifest" href="manifest.json?v=20260912-v6">
  <style>
    html,body{margin:0;height:100%;background:#071728;color:#faf7ee;font-family:Tahoma,Arial,sans-serif}
    #app-loader{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 42%,#0d1b2d 0,#071728 46%,#050f1b 100%);z-index:9999;opacity:1;transition:opacity .18s ease}
    #app-loader.hidden{opacity:0;pointer-events:none}
    .loader-card{width:min(420px,calc(100vw - 48px));padding:40px 28px;border:1px solid #ffffff0f;border-radius:28px;background:#0d1b2de8;box-shadow:0 28px 80px #00000055;backdrop-filter:blur(10px)}
    .loader-mark{width:112px;height:112px;margin:auto;display:block;object-fit:contain;border-radius:30px;box-shadow:0 18px 52px rgba(225,162,58,.20)}
    .loader-title{display:block;margin-top:18px;font-size:26px;line-height:1.35}
    .loader-tagline{margin:8px 0 0;color:#d8cdbd;font-size:15px}
    .loader-ring{width:30px;height:30px;margin:24px auto 12px;border:3px solid #ffffff1f;border-top-color:#e1a23a;border-radius:50%;animation:spin .72s linear infinite}
    #loader-message{margin:0;color:#a89b88;font-size:13px}
    #loader-retry{display:none;margin:20px auto 0;border:0;border-radius:13px;padding:12px 22px;background:#e1a23a;color:#071728;font-weight:800;cursor:pointer}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    // GitHub Pages SPA redirect: restore path from query param (see 404.html)
    (function(l){
      if (l.search && l.search.indexOf('?/') === 0) {
        var decoded = l.search.slice(2).split('&').map(function(part) {
          return part.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(
          null,
          '',
          l.pathname.slice(0, -1) + '/' + decoded + l.hash
        );
      }
    })(window.location);
  </script>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="loader-card">
      <img class="loader-mark" src="icons/Icon-192.png?v=20260912-v6" alt="محتاج محامي" fetchpriority="high">
      <strong class="loader-title">محتاج محامي</strong>
      <p class="loader-tagline">مساندة قانونية وقت ما تحتاجها</p>
      <div class="loader-ring"></div>
      <p id="loader-message">جاري فتح التطبيق...</p>
      <button id="loader-retry" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js?v=a5545174064b80adff88956a72e2e21f8c6aad34" script.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

</body>
