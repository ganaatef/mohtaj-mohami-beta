<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>مركز تشغيل محتاج محامي</title>
<style>
:root{--bg:#11100f;--panel:#1c1917;--line:#332d28;--ink:#fff7ef;--muted:#b7a99f;--orange:#f47a2a;--green:#30a46c;--red:#df4b52;--amber:#d9a441}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif}.shell{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.top h1{margin:0;font-size:26px}.top a,.top button{color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:12px;text-decoration:none;cursor:pointer}.live{display:inline-flex;align-items:center;gap:7px;color:#baf0d0}.dot-live{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #30a46c22}.metrics{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:28px;font-weight:850;margin-top:7px}.critical{border-color:#722b2f}.warning{border-color:#72551c}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}.stack{display:grid;gap:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h2{font-size:17px;margin:0}.muted{color:var(--muted)}.geo{height:470px;position:relative;overflow:hidden;border-radius:13px;background:linear-gradient(180deg,#211e1b,#171513);border:1px solid var(--line)}.geo:before,.geo:after{content:"";position:absolute;inset:0;pointer-events:none}.geo:before{background:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:10% 10%}.geo:after{box-shadow:inset 0 0 80px #0008}.geo-label{position:absolute;color:#786e67;font-size:11px;z-index:1}.geo-point{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(50%,-50%);z-index:3;border:2px solid #fff7ef;box-shadow:0 0 0 4px #0005;cursor:help}.geo-client{background:var(--orange)}.geo-lawyer{background:var(--green);width:10px;height:10px}.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:5px}.table{overflow:auto;max-height:390px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:#ffad76;position:sticky;top:0;background:var(--panel)}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.p-red{background:#5b2024;color:#ffd7da}.p-amber{background:#554014;color:#ffe0a0}.p-green{background:#173c2a;color:#baf0d0}.p-gray{background:#302b27;color:#ddd0c6}.error{padding:14px;border:1px solid #722b2f;background:#391c1e;border-radius:12px;color:#ffc6ca}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.geo{height:360px}}@media(max-width:540px){.shell{padding:12px}.metrics{grid-template-columns:1fr 1fr}.metric .value{font-size:22px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div><h1>مركز التشغيل الحي</h1><div class="live"><span class="dot-live"></span><span id="stamp">جاري الاتصال...</span></div></div>
    <div><a href="./index.html">لوحة الإدارة</a> <button id="refresh">تحديث الآن</button></div>
  </div>
  <div id="error"></div>
  <div id="metrics" class="metrics"></div>
  <div class="grid">
    <div class="stack">
      <section class="card"><div class="section-title"><h2>التوزيع الجغرافي الداخلي</h2><span class="muted">بدون أي خرائط أو Telemetry خارجية</span></div><div id="geo" class="geo"><span class="geo-label" style="top:4%;right:4%">شمال مصر</span><span class="geo-label" style="bottom:4%;right:4%">جنوب مصر</span></div><div class="legend"><span><i style="background:var(--orange)"></i>موقع الطلب</span><span><i style="background:var(--green)"></i>المحامي</span><span>الرسم تشغيلي تقريبي؛ الإحداثيات الدقيقة لا تغادر خوادم المنصة</span></div></section>
      <section class="card"><div class="section-title"><h2>المهام النشطة</h2><span id="taskCount" class="muted"></span></div><div class="table"><table><thead><tr><th>الحالة</th><th>المكان</th><th>المحامي</th><th>GPS</th><th>ETA</th></tr></thead><tbody id="tasks"></tbody></table></div></section>
    </div>
    <div class="stack">
      <section class="card critical"><div class="section-title"><h2>Safety Queue</h2><span id="incidentCount" class="muted"></span></div><div id="incidents"></div></section>
      <section class="card warning"><div class="section-title"><h2>Support SLA</h2><span id="supportCount" class="muted"></span></div><div id="support"></div></section>
    </div>
  </div>
</div>
<script>
const API='https://mohtaj-mohami-beta-production.up.railway.app/api/v1';
const auth=JSON.parse(sessionStorage.getItem('mm_admin')||'null');
if(!auth||!['OPS_AGENT','PLATFORM_ADMIN'].includes(auth.role)){location.replace('./index.html')}
const E=id=>document.getElementById(id),X=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+auth.token},cache:'no-store',credentials:'omit'});if(r.status===401){sessionStorage.removeItem('mm_admin');location.replace('./index.html');return}if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||'تعذر تحميل بيانات التشغيل')}return r.json()}
const label={active_emergency_missions:'مهام طوارئ نشطة',searching_over_5_minutes:'بحث > 5 دقائق',stale_lawyer_locations:'GPS متأخر',available_lawyers:'محامون متاحون',open_safety_incidents:'Safety مفتوحة',critical_safety_incidents:'Safety حرجة',support_sla_breaches:'SLA متجاوز',payment_exceptions:'مشاكل دفع',outbox_pending:'Push Pending',outbox_overdue:'Push متأخر',outbox_dead_letter:'Dead Letter'};
function pill(value){const v=String(value||'');const cls=['CRITICAL','DISPATCHING','FAILED'].includes(v)?'p-red':['HIGH','EN_ROUTE','ARRIVED'].includes(v)?'p-amber':['ASSIGNED','IN_PROGRESS','ACTIVE'].includes(v)?'p-green':'p-gray';return `<span class="pill ${cls}">${X(v)}</span>`}
function fmt(d){if(!d)return '—';try{return new Date(d).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}catch{return X(d)}}
function point(lat,lon,kind,title){if(typeof lat!=='number'||typeof lon!=='number')return'';const minLat=21.7,maxLat=31.8,minLon=24.5,maxLon=36.9;const x=Math.max(1,Math.min(99,100*(lon-minLon)/(maxLon-minLon)));const y=Math.max(1,Math.min(99,100*(maxLat-lat)/(maxLat-minLat)));return `<span class="geo-point ${kind==='lawyer'?'geo-lawyer':'geo-client'}" style="left:${x}%;top:${y}%" title="${X(title)}"></span>`}
function render(d){E('stamp').textContent='آخر تحديث '+new Date(d.generated_at).toLocaleTimeString('ar-EG');E('metrics').innerHTML=Object.entries(d.kpis).map(([k,v])=>`<div class="card metric ${(k.includes('critical')||k.includes('dead_letter'))&&v?'critical':(k.includes('breach')||k.includes('stale')||k.includes('overdue'))&&v?'warning':''}"><div class="label">${X(label[k]||k)}</div><div class="value">${X(v)}</div></div>`).join('');
const tasks=d.active_tasks||[];E('taskCount').textContent=tasks.length+' مهمة';E('tasks').innerHTML=tasks.length?tasks.map(t=>`<tr><td>${pill(t.status)}</td><td>${X(t.city)} · ${X(t.area)}</td><td>${t.assigned_lawyer_id?X(t.assigned_lawyer_id.slice(0,8)):'—'}</td><td>${t.stale_location?'<span class="pill p-red">STALE</span>':t.assigned_lawyer_id?'<span class="pill p-green">LIVE</span>':'—'}</td><td>${fmt(t.expected_arrival_at)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">لا توجد مهام نشطة</td></tr>';
E('geo').querySelectorAll('.geo-point').forEach(n=>n.remove());tasks.forEach(t=>{E('geo').insertAdjacentHTML('beforeend',point(Number(t.client_latitude),Number(t.client_longitude),'client',`${t.status} · ${t.city} · ${t.task_id.slice(0,8)}`));if(t.lawyer_latitude!=null&&t.lawyer_longitude!=null)E('geo').insertAdjacentHTML('beforeend',point(Number(t.lawyer_latitude),Number(t.lawyer_longitude),'lawyer',`Lawyer · ${t.task_id.slice(0,8)}`))});
const incidents=d.safety_incidents||[];E('incidentCount').textContent=incidents.length+' مفتوح';E('incidents').innerHTML=incidents.length?incidents.map(i=>`<div class="card" style="margin:8px 0"><div>${pill(i.severity)} ${pill(i.status)}</div><b>${X(i.incident_type)}</b><div class="muted">Task ${X(i.task_id.slice(0,8))} · ${fmt(i.detected_at)}</div></div>`).join(''):'<div class="empty">لا توجد Safety incidents مفتوحة</div>';
const support=d.support_queue||[];E('supportCount').textContent=support.length+' حالة';E('support').innerHTML=support.length?support.slice(0,30).map(s=>`<div class="card" style="margin:8px 0"><div>${pill(s.severity)} ${s.sla_breached?'<span class="pill p-red">SLA BREACH</span>':''}</div><b>${X(s.subject)}</b><div class="muted">${X(s.category)} · due ${fmt(s.sla_due_at)}</div></div>`).join(''):'<div class="empty">لا توجد حالات دعم مفتوحة</div>'}
async function load(){try{E('error').innerHTML='';render(await api('/admin/control-tower'))}catch(e){E('error').innerHTML=`<div class="error">${X(e.message)}</div>`}}
E('refresh').onclick=load;load();setInterval(load,15000);
</script>
</body></html>
