<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة محتاج محامي</title><style>
:root{--bg:#f7f2eb;--ink:#17110d;--card:#fffdfa;--line:#e4d7ca;--orange:#f47a2a;--green:#19734b;--red:#b32d32;--muted:#75695f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,#ffd4b3,transparent 36%),#17110d}.login form{width:min(430px,100%);background:var(--card);padding:30px;border-radius:26px}.brand{font-size:22px;font-weight:850;display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--orange);color:white}label{display:block;margin:16px 0 7px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white}.primary{border:0;border-radius:12px;background:var(--orange);padding:12px 17px;font-weight:800;cursor:pointer}.wide{width:100%;margin-top:18px}.muted{color:var(--muted)}.error{color:var(--red);margin-top:12px}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#17110d;color:white;padding:22px 15px;position:sticky;top:0;height:100vh}.side .brand{padding:0 8px 20px}.nav{display:grid;gap:6px}.nav button,.logout{border:0;background:transparent;color:#d9cec5;padding:13px;border-radius:11px;text-align:right;cursor:pointer}.nav button.active,.nav button:hover{background:#f47a2a25;color:#ff9b58}.logout{position:absolute;bottom:20px;right:15px;left:15px;border:1px solid #ffffff22}.content{padding:28px;max-width:1250px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0}.badge{background:#e6f3eb;color:var(--green);padding:8px 12px;border-radius:99px}.section{display:none}.section.active{display:block}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.num{font-size:30px;font-weight:850;margin-top:7px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.toolbar input,.toolbar select{max-width:280px}.table{overflow:auto;border:1px solid var(--line);border-radius:17px;background:var(--card)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:right;padding:13px;border-bottom:1px solid #eee4da}th{color:#994318;font-size:13px}.switch{border:0;border-radius:99px;padding:7px 11px;font-weight:700;cursor:pointer}.on{background:#e4f2e9;color:var(--green)}.off{background:#f8e4e5;color:var(--red)}.ticket{display:block;width:100%;text-align:right;background:white;border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}.messages{height:300px;overflow:auto;background:#eee5dc;padding:12px;border-radius:14px}.message{background:white;border-radius:11px;padding:10px;margin:7px}.panel{margin-top:16px}.toast{position:fixed;left:20px;bottom:20px;background:#17110d;color:white;padding:12px 16px;border-radius:12px;z-index:5}@media(max-width:850px){.shell{display:block}.side{height:auto;position:static;padding:10px}.side .brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{position:static;width:100%;margin-top:6px}.content{padding:17px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section id="login" class="login"><form id="loginForm"><div class="brand"><span class="logo">م</span>بوابة إدارة محتاج محامي</div><p class="muted">لفريق التشغيل والإدارة فقط</p><label>رقم الهاتف الدولي</label><input id="phone" dir="ltr" placeholder="+201xxxxxxxxx" required><label>الحساب</label><select id="role"><option value="PLATFORM_ADMIN">مدير المنصة</option><option value="OPS_AGENT">تشغيل ودعم</option></select><div id="otp" class="hidden"><label>كود التحقق</label><input id="code" dir="ltr" placeholder="000000"><label>الاسم</label><input id="name" value="مدير المنصة"></div><button id="loginBtn" class="primary wide">إرسال كود التحقق</button><div id="error" class="error"></div></form></section>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><span class="logo">م</span>لوحة الإدارة</div><nav id="nav" class="nav"><button class="active" data-v="overview">نظرة عامة</button><button data-v="verification">مراجعة الهويات</button><button data-v="services">الخدمات</button><button data-v="users">المستخدمون</button><button data-v="activation" data-admin>تفعيل الحسابات</button><button data-v="support">خدمة العملاء</button><button data-v="settings">إعدادات التطبيق</button><button data-v="audit" data-admin>سجل العمليات</button><button data-v="directory" data-admin>الدليل القانوني</button><button data-v="settlements" data-admin>التسويات</button></nav><button id="logout" class="logout">تسجيل الخروج</button></aside><main class="content"><div class="top"><div><h1 id="title">نظرة عامة</h1><span id="identity" class="muted"></span></div><span class="badge">متصل بالخدمة الحية</span></div>
<section id="overview" class="section active"><div id="metrics" class="metrics"></div></section>
<section id="verification" class="section"><div class="toolbar"><select id="verifyRole"><option value="CLIENT">العملاء</option><option value="LAWYER">المحامون</option></select><select id="verifyStatus"><option value="PENDING">بانتظار المراجعة</option><option value="">كل الحالات</option><option value="VERIFIED">موثق</option><option value="REJECTED">مرفوض</option><option value="NEEDS_RESUBMISSION">مطلوب إعادة الإرسال</option></select><button class="primary" onclick="verification()">تحديث</button></div><div id="verificationRows"></div></section>
<section id="services" class="section"><div class="toolbar"><button class="primary" onclick="services()">تحديث</button></div><div class="table"><table><thead><tr><th>الخدمة</th><th>English</th><th>النوع</th><th>الحالة</th></tr></thead><tbody id="serviceRows"></tbody></table></div></section>
<section id="users" class="section"><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو الهاتف"><select id="filter"><option value="">كل الحسابات</option><option>CLIENT</option><option>LAWYER</option><option>OPS_AGENT</option><option>PLATFORM_ADMIN</option></select></div><div class="table"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الدور</th><th>موثق</th><th>الحالة</th></tr></thead><tbody id="userRows"></tbody></table></div></section>
<section id="activation" class="section"><div class="toolbar"><select id="activationStatus"><option value="PENDING_ADMIN_ACTIVATION">بانتظار التفعيل</option><option value="PENDING_EMAIL_VERIFICATION">بانتظار التحقق من البريد</option><option value="ACTIVE">نشط</option><option value="REJECTED">مرفوض</option></select><button class="primary" onclick="loadActivationQueue()">تحديث</button></div><div id="activationRows"></div></section>
<section id="support" class="section"><div class="toolbar"><button class="primary" onclick="tickets()">تحديث</button></div><div id="ticketRows"></div><div id="conversation" class="hidden panel"><div class="toolbar"><span id="convRequester" class="muted"></span><select id="ticketStatus"><option>OPEN</option><option>IN_PROGRESS</option><option>WAITING_USER</option><option>RESOLVED</option><option>CLOSED</option></select><button class="switch on" onclick="activity()">سجل النشاط</button></div><div id="messages" class="messages"></div><div id="activityRows" class="hidden panel"></div><div class="toolbar panel"><input id="reply" placeholder="اكتب الرد"><button id="send" class="primary">إرسال</button></div></div></section>
<section id="settings" class="section"><div id="settingRows" class="metrics"></div></section>
<section id="audit" class="section"><div class="table"><table><thead><tr><th>التاريخ</th><th>العملية</th><th>النوع</th><th>التفاصيل</th></tr></thead><tbody id="auditRows"></tbody></table></div></section>
<section id="directory" class="section"><div class="toolbar"><input id="dirSearch" placeholder="بحث بالاسم"><select id="dirCategory"><option value="">كل الفئات</option><option value="COURT">محاكم</option><option value="POLICE">أجهزة الشرطة</option><option value="PROSECUTION">نيابة</option><option value="NOTARY">شهر عقاري</option><option value="BAR_ASSOCATION">نقابة المحامين</option><option value="GOVERNMENT">جهة حكومية</option><option value="OTHER">أخرى</option></select><button class="primary" onclick="loadDirectory()">تحديث</button></div><div id="dirRows"></div></section>
<section id="settlements" class="section"><div class="toolbar"><button class="primary" onclick="loadSettlements()">تحديث</button></div><div id="settlementRows"></div></section>
</main></div><div id="toast" class="toast hidden"></div><script>
const API='https://mohtaj-mohami-beta-production.up.railway.app/api/v1',E=id=>document.getElementById(id),X=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let auth=JSON.parse(sessionStorage.getItem('mm_admin')||'null'),sent=false,allUsers=[],ticket=null;
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+auth.token}:{}),...(opt.headers||{})}});if(r.status===401){sessionStorage.removeItem('mm_admin');location.reload()}if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(d?.detail||'تعذر إتمام الطلب')}return r.status===204?null:r.json()}
function note(s){E('toast').textContent=s;E('toast').classList.remove('hidden');setTimeout(()=>E('toast').classList.add('hidden'),2500)}function role(r){return({CLIENT:'عميل',LAWYER:'محامي',OPS_AGENT:'تشغيل ودعم',PLATFORM_ADMIN:'مدير المنصة'})[r]||r}function senderRole(r){return({CLIENT:'عميل',LAWYER:'محامي',OPS_AGENT:'فريق الدعم',PLATFORM_ADMIN:'مدير المنصة'})[r]||r||''}
E('loginForm').onsubmit=async e=>{e.preventDefault();E('error').textContent='';try{if(!sent){await api('/auth/otp/request',{method:'POST',body:JSON.stringify({phone:E('phone').value.trim(),role:E('role').value})});sent=true;E('otp').classList.remove('hidden');E('loginBtn').textContent='دخول آمن'}else{auth=await api('/auth/otp/verify',{method:'POST',body:JSON.stringify({phone:E('phone').value.trim(),role:E('role').value,code:E('code').value.trim(),display_name:E('name').value.trim()})});if(!['OPS_AGENT','PLATFORM_ADMIN'].includes(auth.role))throw Error('غير مصرح لهذا الحساب');sessionStorage.setItem('mm_admin',JSON.stringify(auth));start()}}catch(x){E('error').textContent=x.message}};
function start(){if(!auth)return;E('login').classList.add('hidden');E('app').classList.remove('hidden');E('identity').textContent=role(auth.role);document.querySelectorAll('[data-admin]').forEach(x=>x.classList.toggle('hidden',auth.role!=='PLATFORM_ADMIN'));overview()}E('logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}sessionStorage.removeItem('mm_admin');location.reload()};
E('nav').onclick=e=>{let b=e.target.closest('[data-v]');if(!b)return;document.querySelectorAll('.nav button,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');E(b.dataset.v).classList.add('active');E('title').textContent=b.textContent;({overview,verification,services,users,support:tickets,settings,audit,directory:loadDirectory,settlements:loadSettlements}[b.dataset.v])()};
async function overview(){try{let d=await api('/admin/overview'),m={users:'المستخدمون',clients:'العملاء',lawyers:'المحامون',active_tasks:'الطلبات النشطة',open_support_tickets:'تذاكر الدعم'};E('metrics').innerHTML=Object.entries(m).map(([k,v])=>`<div class="card"><span class="muted">${v}</span><div class="num">${X(d[k])}</div></div>`).join('')}catch(x){note(x.message)}}
async function verification(){try{let roleFilter=E('verifyRole').value,status=E('verifyStatus').value,q='?role_filter='+roleFilter+(status?'&status_filter='+status:'');let d=await api('/admin/verification/queue'+q);E('verificationRows').innerHTML=d.map(v=>{let p=v.profile||{},state=v.identity_status||v.lawyer_verification_status,docs=(v.documents||[]).map(f=>`<button class="switch on" onclick="viewDoc('${f.id}')">${X(f.document_type)}</button>`).join(' ');return `<div class="card panel"><div class="top"><div><b>${X(v.display_name)}</b><div class="muted">${role(v.role)} · ${X(state)}</div></div><span class="badge">${(v.documents||[]).length} مستند</span></div><p>${X(p.full_legal_name)} · ${X(p.date_of_birth||p.bar_registration_number||p.id_type)}</p><div class="toolbar">${docs||'<span class="muted">لا توجد مستندات</span>'}</div><div class="toolbar"><button class="switch on" onclick="review('${v.user_id}','APPROVE')">اعتماد</button><button class="switch off" onclick="review('${v.user_id}','REQUEST_RESUBMISSION')">طلب إعادة الإرسال</button><button class="switch off" onclick="review('${v.user_id}','REJECT')">رفض</button></div></div>`}).join('')||'<div class="card muted">لا توجد طلبات مراجعة في هذه القائمة.</div>'}catch(x){note(x.message)}}
async function review(id,action){let notes=action==='APPROVE'?'تمت مراجعة البيانات والمستندات':prompt('اكتب سبب القرار للمستخدم');if(notes===null)return;try{await api('/admin/verification/'+id,{method:'POST',body:JSON.stringify({action,notes})});note('تم تسجيل قرار المراجعة');verification()}catch(x){note(x.message)}}
async function viewDoc(id){try{let r=await fetch(API+'/documents/'+id+'/download',{headers:{Authorization:'Bearer '+auth.token}});if(!r.ok)throw Error('تعذر فتح المستند');let url=URL.createObjectURL(await r.blob());window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(x){note(x.message)}}E('verifyRole').onchange=()=>{E('verifyStatus').value='PENDING';verification()};E('verifyStatus').onchange=verification;
async function services(){try{let d=await api('/admin/services');E('serviceRows').innerHTML=d.map(s=>`<tr><td>${X(s.name_ar)}</td><td>${X(s.name_en)}</td><td>${s.emergency?'طوارئ':'عادية'}</td><td><button class="switch ${s.active?'on':'off'}" ${auth.role!=='PLATFORM_ADMIN'?'disabled':''} onclick="service('${s.id}',${!s.active})">${s.active?'مفعلة':'متوقفة'}</button></td></tr>`).join('')}catch(x){note(x.message)}}async function service(id,active){try{await api('/admin/services/'+id,{method:'PATCH',body:JSON.stringify({active})});note('تم تحديث الخدمة');services()}catch(x){note(x.message)}}
async function users(){try{allUsers=await api('/admin/users'+(E('filter').value?'?role='+E('filter').value:''));renderUsers()}catch(x){note(x.message)}}function renderUsers(){let q=E('search').value;E('userRows').innerHTML=allUsers.filter(u=>!q||`${u.display_name} ${u.phone}`.includes(q)).map(u=>`<tr><td>${X(u.display_name)}</td><td dir="ltr">${X(u.phone)}</td><td>${role(u.role)}</td><td>${u.verified?'نعم':'لا'}</td><td><button class="switch ${u.active?'on':'off'}" ${auth.role!=='PLATFORM_ADMIN'?'disabled':''} onclick="user('${u.id}',${!u.active})">${u.active?'نشط':'موقوف'}</button></td></tr>`).join('')}E('search').oninput=renderUsers;E('filter').onchange=users;async function user(id,active){try{await api('/admin/users/'+id,{method:'PATCH',body:JSON.stringify({active})});note('تم تحديث المستخدم');users()}catch(x){note(x.message)}}
async function tickets(){try{let d=await api('/support/tickets');E('ticketRows').innerHTML=d.map(t=>`<button class="ticket" onclick="openTicket('${t.id}')"><b>${X(t.subject)}</b><div class="muted">${X(t.requester_name||t.requester_id)} · ${senderRole(t.requester_role)} · ${X(t.status)} · ${X(t.priority)}</div></button>`).join('')||'<div class="card muted">لا توجد تذاكر</div>';window._tickets=d}catch(x){note(x.message)}}async function openTicket(id){stopPoll();ticket=window._tickets.find(x=>x.id===id);E('conversation').classList.remove('hidden');E('activityRows').classList.add('hidden');E('convRequester').textContent=(ticket.requester_name||ticket.requester_id||'')+' · '+(senderRole(ticket.requester_role));E('ticketStatus').value=ticket.status;loadMessages();window._chatTimer=setInterval(loadMessages,10000)}function stopPoll(){clearInterval(window._chatTimer)}async function loadMessages(){if(!ticket)return;let d=await api('/support/tickets/'+ticket.id+'/messages');E('messages').innerHTML=d.map(m=>`<div class="message"><b>${X(m.sender_name||'')} <span class="badge">${X(senderRole(m.sender_role))}</span></b><div>${X(m.content)}</div></div>`).join('')}async function activity(){if(!ticket)return;let t=ticket;try{let d=await api('/admin/support/tickets/'+t.id+'/requester-activity');let tasks=d.tasks||[];E('activityRows').classList.remove('hidden');E('activityRows').innerHTML=(tasks.length?tasks.map(x=>`<div class="card panel"><div class="top"><b>${X(x.venue_type||'')} · ${X(x.city||'')} ${X(x.area||'')}</b>${x.emergency?'<span class="badge">طوارئ</span>':''}</div><div class="muted">${X(x.status||'')} · ${X((x.created_at||'').substring(0,10))}</div></div>`).join(''):'<div class="card muted">لا يوجد نشاط مسجل لهذا المتحدث</div>');E('messages').scrollTop=E('messages').scrollHeight}catch(x){note(x.message)}}E('send').onclick=async()=>{let content=E('reply').value.trim();if(!content||!ticket)return;try{await api('/support/tickets/'+ticket.id+'/messages',{method:'POST',body:JSON.stringify({content})});E('reply').value='';loadMessages()}catch(x){note(x.message)}};E('ticketStatus').onchange=async()=>{try{ticket=await api('/admin/support/tickets/'+ticket.id,{method:'PATCH',body:JSON.stringify({status:E('ticketStatus').value})});note('تم تحديث التذكرة')}catch(x){note(x.message)}};
async function settings(){try{let d=await api('/admin/settings');E('settingRows').innerHTML=d.map(s=>`<div class="card"><b>${X(s.key)}</b><p class="muted">${X(s.value)}</p>${auth.role==='PLATFORM_ADMIN'?`<button class="switch on" onclick="setting('${s.key}','${X(s.value)}','${s.value_type}',${s.public})">تعديل</button>`:''}</div>`).join('')}catch(x){note(x.message)}}async function setting(key,old,type,pub){let value=prompt('القيمة الجديدة لـ '+key,old);if(value===null)return;try{await api('/admin/settings/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({value,value_type:type,public:pub})});note('تم الحفظ');settings()}catch(x){note(x.message)}}
async function audit(){try{let d=await api('/admin/audit-logs');E('auditRows').innerHTML=d.map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('ar-EG')}</td><td>${X(a.action)}</td><td>${X(a.entity_type)}</td><td>${X(a.details)}</td></tr>`).join('')}catch(x){note(x.message)}}if(auth)start();
async function loadDirectory(){try{let params=new URLSearchParams();let q=E('dirSearch').value.trim();let cat=E('dirCategory').value;if(q)params.set('q',q);if(cat)params.set('category',cat);let d=await api('/directory?'+params);E('dirRows').innerHTML=d.map(e=>`<div class="card panel"><div class="top"><b>${X(e.official_name_ar)}</b><span class="badge">${X(e.category)}</span></div><div class="muted">${X(e.official_name_en||'')} · ${X(e.governorate||'')} · ${X(e.address||'')}</div><div class="muted">هاتف: ${X(e.phone_numbers||'—')}</div></div>`).join('')||'<div class="card muted">لا توجد نتائج</div>'}catch(x){note(x.message)}}
async function loadSettlements(){try{E('settlementRows').innerHTML='<div class="card muted">جاري تحميل الطلبات المعلقة...</div>';let d=await api('/admin/tasks?status=COMPLETION_CONFIRMED');E('settlementRows').innerHTML=d.map(t=>`<div class="card panel"><div class="top"><b>${X(t.id.substring(0,8))}</b><span class="badge">${X(t.status)}</span></div><div class="muted">${X(t.client_name||'')} · ${X(t.lawyer?.display_name||'')}</div><div class="toolbar"><button class="switch on" onclick="adminSettle('${t.id}','SETTLE')">تسوية</button><button class="switch off" onclick="adminSettle('${t.id}','HOLD')">إيقاف</button></div></div>`).join('')||'<div class="card muted">لا توجد طلبات معلقة</div>'}catch(x){note(x.message)}}
async function adminSettle(id,action){let reason=prompt(action==='SETTLE'?'سبب التسوية':'سبب الإيقاف');if(reason===null)return;try{await api('/admin/tasks/'+id+'/settle',{method:'POST',body:JSON.stringify({action,reason})});note('تم تحديث الحالة');loadSettlements()}catch(x){note(x.message)}}
async function loadActivationQueue(){try{let status=E('activationStatus').value;let d=await api('/admin/pending-users?status='+status);E('activationRows').innerHTML=d.map(u=>`<div class="card panel"><div class="top"><div><b>${X(u.display_name)}</b><div class="muted">${role(u.role)} · ${X(u.email||'—')} · ${X(u.phone||'—')}</div></div><span class="badge">${X(u.account_status)}</span></div><div class="muted">مسجل: ${new Date(u.created_at).toLocaleDateString('ar-EG')}</div>${status==='PENDING_ADMIN_ACTIVATION'?`<div class="toolbar"><button class="switch on" onclick="activateUser('${u.id}','ACTIVE')">تفعيل</button><button class="switch off" onclick="activateUser('${u.id}','REJECTED')">رفض</button></div>`:''}</div>`).join('')||'<div class="card muted">لا توجد حسابات في هذه القائمة.</div>'}catch(x){note(x.message)}}
async function activateUser(id,status){let notes=status==='ACTIVE'?'تمت مراجعة المستندات والموافقة على التفعيل':prompt('اكتب سبب الرفض للمستخدم');if(notes===null)return;try{await api('/admin/activate-user',{method:'POST',body:JSON.stringify({user_id:id,status,notes})});note(status==='ACTIVE'?'تم تفعيل الحساب بنجاح':'تم رفض الحساب');loadActivationQueue()}catch(x){note(x.message)}}
E('activationStatus').onchange=loadActivationQueue;
</script></body></html>
